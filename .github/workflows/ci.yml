name: CI

on:
    pull_request:
    push:
        branches:
            - develop
            - main
            - 'release/**'

permissions:
    contents: read

jobs:
    baseline:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install from lockfile
              run: npm ci

            - name: Run operational baseline
              run: npm run ci
