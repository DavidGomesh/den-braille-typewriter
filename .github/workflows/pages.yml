name: GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            source_run_id:
                description: ID of the run that produced the stable artifact to redeploy
                required: false
                type: string

permissions:
    actions: read
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    prepare:
        name: Prepare artifact
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            actions: read
            contents: read
            pages: write

        steps:
            - name: Restrict stable deployments to main
              if: inputs.source_run_id == '' && github.ref != 'refs/heads/main'
              run: |
                  echo "Stable deployments only accept the main branch." >&2
                  exit 1

            - name: Checkout
              if: inputs.source_run_id == ''
              uses: actions/checkout@v4

            - name: Set up Node.js
              if: inputs.source_run_id == ''
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install from lockfile
              if: inputs.source_run_id == ''
              run: npm ci

            - name: Run operational baseline
              if: inputs.source_run_id == ''
              run: npm run ci

            - name: Store artifact for rollback
              if: inputs.source_run_id == ''
              uses: actions/upload-artifact@v4
              with:
                  name: vite-pages-dist
                  path: dist
                  if-no-files-found: error
                  retention-days: 90

            - name: Retrieve known stable artifact
              if: inputs.source_run_id != ''
              uses: actions/download-artifact@v4
              with:
                  name: vite-pages-dist
                  path: dist
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ inputs.source_run_id }}

            - name: Identify source run commit
              if: inputs.source_run_id != ''
              id: rollback-origin
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data: sourceRun } = await github.rest.actions.getWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: Number('${{ inputs.source_run_id }}'),
                      })
                      if (sourceRun.head_branch !== 'main') {
                        core.setFailed('The source run does not belong to the main branch.')
                        return
                      }
                      if (sourceRun.conclusion !== 'success') {
                        core.setFailed('The source run did not complete successfully.')
                        return
                      }
                      core.setOutput('head_sha', sourceRun.head_sha)
                      core.setOutput('url', sourceRun.html_url)

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Package Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - name: Record deployment provenance
              env:
                  SOURCE_COMMIT: ${{ steps.rollback-origin.outputs.head_sha || github.sha }}
                  SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
                  SOURCE_RUN_URL: ${{ steps.rollback-origin.outputs.url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
              run: |
                  echo "### Artifact ready for deployment" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Source commit: \`${SOURCE_COMMIT}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Source run: [\`${SOURCE_RUN_ID}\`](${SOURCE_RUN_URL})" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Pages artifact: \`github-pages\`" >> "$GITHUB_STEP_SUMMARY"

    deploy:
        name: Deploy
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
